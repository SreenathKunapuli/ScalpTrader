name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (CPU torch first — keeps the wheel small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,research]"
      - name: Lint
        run: ruff check engine api
      - name: Platform tests
        run: pytest engine/tests api -q
      - name: Research tests
        run: pytest research/tests -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # CD note: engine runs on the owner's machine by design (local market data
  # + broker session). Hosted deploy targets (Fly.io API, Vercel web, managed
  # Postgres) are Phase 4 — wire their deploy jobs here once accounts exist.
