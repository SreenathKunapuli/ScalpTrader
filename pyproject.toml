[project]
name = "scalptrader"
version = "0.1.0"
description = "ML scalping platform for cheap volatile stocks (engine + API), paper-trading only"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.21",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "structlog>=24.1",
    "exchange-calendars>=4.5",
    "numpy>=1.26",
    "pandas>=2.0",
    "torch>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "aiosqlite>=0.20",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.10", "hypothesis>=6.100"]
research = ["scikit-learn>=1.3", "pyarrow>=15", "matplotlib>=3.7"]

[project.scripts]
scalpctl = "scalpengine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["engine"]
include = ["scalpengine*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["research", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["engine/scalpengine"]
ignore_missing_imports = true
exclude = ["research", "web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["engine/tests", "research/tests"]
